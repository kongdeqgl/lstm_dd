[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sinr-predictor"
version = "0.2.0"
description = "Causal graph encoder and link-level LSTM for multi-step SINR prediction"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = []

[project.optional-dependencies]
dev = ["ruff"]
algorithm = ["torch>=2.6,<3", "numpy>=1.26,<3"]

[project.scripts]
sinr-predict = "sinr_predictor.inference.cli:main"
sinr-train = "sinr_predictor.training.graph_train:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
